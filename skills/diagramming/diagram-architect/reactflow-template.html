<!DOCTYPE html>
<html lang="en">
<!--
  diagram-architect · React Flow + ELK reference template
  A self-contained, CDN-only starting point for presentation-grade node+edge
  diagrams. ADAPT IT: swap the :root theme tokens for the extracted brand palette,
  and replace RAW_NODES / RAW_EDGES / ZONES with the grounded content.
  No build step — open directly in a browser or an IDE HTML preview.
-->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagram</title>
<!-- React Flow stylesheet as a normal <link> — importing CSS as an ES module fails in browsers -->
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12/dist/style.css" />
<style>
  /* ---- THEME TOKENS: replace with the extracted brand palette ---- */
  :root {
    --primary:#0b3d6b;      /* headings, node header bar */
    --accent:#1b7ce0;       /* edges, emphasis */
    --zone-bg:#e8f2ff;      /* zone/group container fill */
    --zone-border:#bcd8f5;
    --card:#ffffff;         /* node body */
    --text:#12222f;
    --muted:#5a6b7b;
    --font:'Inter','Segoe UI',Arial,sans-serif;
  }
  html,body{margin:0;height:100%;background:#f4f8ff;font-family:var(--font);color:var(--text);}
  #app{display:flex;flex-direction:column;width:100vw;height:100vh;}
  /* header is part of the "framed" export; toolbar is chrome and excluded from every export */
  #header{padding:14px 20px;background:var(--card);border-bottom:2px solid var(--primary);}
  #header h1{margin:0;font-size:18px;color:var(--primary);} #header p{margin:2px 0 0;font-size:12px;color:var(--muted);}
  #toolbar{display:flex;gap:8px;align-items:center;padding:8px 16px;background:#eef4fb;border-bottom:1px solid var(--zone-border);font-size:13px;}
  #toolbar button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--primary);background:var(--primary);
    color:#fff;border-radius:6px;cursor:pointer;} #toolbar button.ghost{background:#fff;color:var(--primary);}
  #toolbar label{display:flex;gap:5px;align-items:center;color:var(--text);cursor:pointer;margin-left:6px;}
  #toolbar .spacer{flex:1;} #toolbar .hint{color:var(--muted);font-size:11.5px;}
  #canvas{flex:1;position:relative;}
  .rf-node{background:var(--card);border:1px solid var(--zone-border);border-radius:10px;
    box-shadow:0 2px 10px rgba(11,61,107,.10);min-width:150px;overflow:hidden;font-family:var(--font);}
  .rf-node .hdr{background:var(--primary);color:#fff;font-weight:700;font-size:12.5px;padding:6px 10px;}
  .rf-node .body{padding:7px 10px;font-size:11.5px;color:var(--muted);line-height:1.35;}
  .rf-zone{background:var(--zone-bg);border:1.5px dashed var(--zone-border);border-radius:14px;}
  .rf-zone .zlabel{position:absolute;top:6px;left:12px;font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.03em;}
  .react-flow__edge-path{stroke:var(--accent);stroke-width:1.8;}
  .react-flow__edge-text{font-size:10px;fill:var(--text);font-family:var(--font);}
  .react-flow__arrowhead{fill:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import React, { useEffect, useState, useCallback } from 'https://esm.sh/react@18';
import { createRoot } from 'https://esm.sh/react-dom@18/client';
import {
  ReactFlow,
  Background, Controls, MarkerType, Handle, Position, ReactFlowProvider, useReactFlow,
  applyNodeChanges
} from 'https://esm.sh/@xyflow/react@12?deps=react@18,react-dom@18';
import ELK from 'https://esm.sh/elkjs@0.9.3/lib/elk.bundled.js';
import { toPng, toJpeg, toSvg } from 'https://esm.sh/html-to-image@1.11.11';
// (React Flow CSS is loaded via <link> in <head> — do NOT import CSS as a module, it throws)

// ---- DIAGRAM META: edit title/subtitle (shown in header + "framed" exports) ----
const TITLE = 'Diagram Title';
const SUBTITLE = 'subtitle / source / date';

const elk = new ELK();

// --- WCAG contrast auto-check: logs any text/bg pair below 4.5:1 to the console ---
// Beats eyeballing. Add your text/bg token pairs; open devtools to see failures.
function contrastRatio(hex1, hex2){
  const lum = h => { const c=h.replace('#',''); const v=[0,2,4].map(i=>{
    let x=parseInt(c.length===3?c[i/2]+c[i/2]:c.substr(i,2),16)/255;
    return x<=.03928?x/12.92:((x+.055)/1.055)**2.4; }); return .2126*v[0]+.7152*v[1]+.0722*v[2]; };
  const [a,b]=[lum(hex1),lum(hex2)].sort((x,y)=>y-x); return (a+.05)/(b+.05);
}
function checkContrast(pairs){ // [{name,text,bg}]
  pairs.forEach(p=>{ const r=contrastRatio(p.text,p.bg);
    console[r<4.5?'error':'log'](`contrast ${p.name}: ${r.toFixed(2)}:1 ${r<4.5?'✗ FAIL (<4.5)':'✓'} (${p.text} on ${p.bg})`); });
}
// Fill with the actual token pairs you used, then read the console during Render Validation:
checkContrast([
  { name:'node title',  text:'#ffffff', bg:'#0b3d6b' },
  { name:'node body',   text:'#5a6b7b', bg:'#ffffff' },
  { name:'zone label',  text:'#0b3d6b', bg:'#e8f2ff' },
]);

// ---- GROUNDED CONTENT: replace these three with your real diagram ----
// Zones (parent/group nodes). Omit `zones` for a flat diagram.
const ZONES = [
  { id:'z_src',  label:'SOURCES' },
  { id:'z_hub',  label:'PROCESSING' },
  { id:'z_out',  label:'OUTPUTS' },
];
const RAW_NODES = [
  { id:'a', zone:'z_src', title:'System A', sub:'real name · count' },
  { id:'b', zone:'z_src', title:'System B', sub:'real name · count' },
  { id:'t', zone:'z_hub', title:'Transform', sub:'what it does' },
  { id:'o', zone:'z_out', title:'Destination', sub:'result' },
];
const RAW_EDGES = [
  { source:'a', target:'t', label:'batch · nightly' },
  { source:'b', target:'t', label:'stream · live' },
  { source:'t', target:'o', label:'writes' },
];
// ----------------------------------------------------------------------

// size a node from its text so titles never clip
const nodeW = (n) => Math.max(150, 9 * Math.max(n.title.length, (n.sub||'').length) + 24);
const nodeH = 54;

function CustomNode({ data }) {
  return React.createElement('div', { className:'rf-node', style:{ width:data.w } },
    React.createElement(Handle, { type:'target', position:Position.Left }),
    React.createElement('div', { className:'hdr' }, data.title),
    data.sub ? React.createElement('div', { className:'body' }, data.sub) : null,
    React.createElement(Handle, { type:'source', position:Position.Right })
  );
}
function ZoneNode({ data }) {
  return React.createElement('div', { className:'rf-zone', style:{ width:'100%', height:'100%' } },
    React.createElement('div', { className:'zlabel' }, data.label));
}
const nodeTypes = { custom: CustomNode, zone: ZoneNode };

async function layout() {
  const children = ZONES.map(z => ({
    id: z.id,
    layoutOptions: { 'elk.padding':'[top=34,left=16,bottom=16,right=16]' },
    children: RAW_NODES.filter(n => n.zone === z.id).map(n => ({ id:n.id, width:nodeW(n), height:nodeH })),
  }));
  const graph = {
    id:'root',
    layoutOptions:{
      'elk.algorithm':'layered',
      'elk.direction':'RIGHT',
      'elk.spacing.nodeNode':'60',
      'elk.layered.spacing.nodeNodeBetweenLayers':'90',
      'elk.hierarchyHandling':'INCLUDE_CHILDREN',
    },
    children,
    edges: RAW_EDGES.map((e,i)=>({ id:'e'+i, sources:[e.source], targets:[e.target] })),
  };
  const res = await elk.layout(graph);
  const nodes = [], byId = {};
  for (const z of res.children) {
    nodes.push({ id:z.id, type:'zone', position:{x:z.x,y:z.y},
      data:{label:(ZONES.find(q=>q.id===z.id)||{}).label},
      style:{width:z.width,height:z.height}, selectable:false, draggable:false, zIndex:0 });
    for (const c of (z.children||[])) {
      const meta = RAW_NODES.find(n=>n.id===c.id);
      byId[c.id] = { id:c.id, type:'custom', parentId:z.id, extent:'parent',
        position:{x:c.x,y:c.y}, data:{...meta, w:c.width}, zIndex:1 };
      nodes.push(byId[c.id]);
    }
  }
  const edges = RAW_EDGES.map((e,i)=>({ id:'e'+i, source:e.source, target:e.target, label:e.label,
    type:'smoothstep', markerEnd:{type:MarkerType.ArrowClosed}, labelBgPadding:[4,2],
    labelBgStyle:{fill:'#fff',fillOpacity:.9} }));
  return { nodes, edges };
}

const h = React.createElement;

function Flow(){
  const [nodes,setNodes] = useState([]);
  const [edges,setEdges] = useState([]);
  const [withHeader,setWithHeader] = useState(true);   // export: framed (header) vs diagram-only
  const [busy,setBusy] = useState(false);
  const { fitView } = useReactFlow();

  useEffect(()=>{ layout().then(({nodes,edges})=>{ setNodes(nodes); setEdges(edges); }); },[]);
  const onInit = useCallback(()=>setTimeout(()=>fitView({padding:.15}),50),[fitView]);
  // controlled nodes → user can DRAG to reposition; changes persist (and export captures them)
  const onNodesChange = useCallback((chg)=>setNodes(ns=>applyNodeChanges(chg,ns)),[]);

  // Export. `mode`: 'png' | 'jpeg' | 'svg'. Honors the header toggle.
  // The React Flow viewport is the diagram; #header is optional; #toolbar is ALWAYS excluded.
  async function exportImage(mode){
    setBusy(true);
    try{
      fitView({padding:.12}); await new Promise(r=>setTimeout(r,250));
      const target = withHeader ? document.getElementById('app')
                                : document.querySelector('.react-flow__viewport');
      const opts = {
        pixelRatio: 2, cacheBust: true, backgroundColor: '#ffffff',
        // never capture the toolbar (it's UI chrome, not the diagram)
        filter: (n)=> !(n?.id==='toolbar' || n?.classList?.contains?.('react-flow__controls')
                        || n?.classList?.contains?.('react-flow__minimap')),
      };
      const fn = mode==='png'? toPng : mode==='jpeg'? toJpeg : toSvg;
      const dataUrl = await fn(target, mode==='jpeg'?{...opts,quality:.95}:opts);
      const a=document.createElement('a');
      a.download = `diagram${withHeader?'':'-bare'}.${mode==='jpeg'?'jpg':mode}`;
      a.href=dataUrl; a.click();
    }catch(e){ alert('Export failed: '+e.message); }
    finally{ setBusy(false); }
  }

  const toolbar = h('div',{id:'toolbar'},
    h('strong',{style:{color:'#0b3d6b'}},'Export:'),
    h('button',{onClick:()=>exportImage('png'),disabled:busy},'PNG'),
    h('button',{onClick:()=>exportImage('jpeg'),disabled:busy},'JPEG'),
    h('button',{className:'ghost',onClick:()=>exportImage('svg'),disabled:busy},'SVG'),
    h('label',null, h('input',{type:'checkbox',checked:withHeader,
      onChange:e=>setWithHeader(e.target.checked)}), 'include header'),
    h('button',{className:'ghost',onClick:()=>fitView({padding:.15})},'Fit'),
    h('span',{className:'spacer'}),
    h('span',{className:'hint'}, busy?'rendering…':'drag nodes to reposition · export uses current layout')
  );

  const header = h('div',{id:'header'}, h('h1',null,TITLE), SUBTITLE?h('p',null,SUBTITLE):null);

  const canvas = h('div',{id:'canvas'},
    h(ReactFlow,{ nodes, edges, nodeTypes, onNodesChange, onInit, fitView,
      proOptions:{hideAttribution:true}, minZoom:.2, maxZoom:2, nodesDraggable:true },
      h(Background,{gap:20,color:'#dde8f5'}), h(Controls))
  );

  // header is inside #app so "include header" captures it; toolbar sits above and is filtered out
  return h(React.Fragment,null, toolbar, header, canvas);
}

// mount: toolbar/header/canvas all live under #app (export target when header included)
createRoot(document.getElementById('app')).render(
  h(ReactFlowProvider, null, h(Flow))
);
</script>
</body>
</html>
